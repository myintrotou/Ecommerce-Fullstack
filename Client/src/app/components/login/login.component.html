<div class="auth-container">
  <div class="glass-card auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details</p>

    <form (submit)="login()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="credentials.email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="credentials.password" placeholder="••••••••" required>
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="btn-primary w-full">Sign In</button>
    </form>

    <p class="footer-link">
      Don't have an account? <a routerLink="/register">Sign up for free</a>
    </p>
  </div>
</div>
